version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: energy_forecast_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml
      - ./database:/app/database
      - ./uploads:/app/uploads
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./database/energy_forecasting.db
      - ENVIRONMENT=production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: energy_forecast_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  realtime_simulator:
    build:
      context: .
      dockerfile: realtime/Dockerfile
    container_name: energy_forecast_simulator
    volumes:
      - ./realtime:/app/realtime
      - ./ml/data:/app/ml/data
    environment:
      - API_URL=http://backend:8000/api
      - SIMULATOR_FREQUENCY_SECONDS=3
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
